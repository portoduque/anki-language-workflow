name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  readme-contract:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require README update with project changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          echo "$changed"
          if echo "$changed" | grep -qv '^README.md$' && ! echo "$changed" | grep -qx 'README.md'; then
            echo 'ERROR: Repository changes must include an updated README.md.'
            exit 1
          fi

  smoke:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r anki-language/requirements.txt pytest
      - name: Validate portable skill
        run: python anki-language/scripts/validate_skill.py anki-language
      - name: Run tests
        run: pytest -q